<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="This reader has moved to its own site."><meta name="theme-color" content="#fbfaf7"><title>Omniscient Reader’s Viewpoint</title>
<link rel="canonical" href="https://jehlp.net/omniscient-readers-viewpoint/"><meta property="og:type" content="website"><meta property="og:site_name" content="jehlp.net"><meta property="og:title" content="Omniscient Reader’s Viewpoint"><meta property="og:description" content="This reader has moved to its own site."><meta property="og:url" content="https://jehlp.net/omniscient-readers-viewpoint/"><meta property="og:image" content="https://jehlp.net/site-theme/v2/cards/omniscient-readers-viewpoint.png"><meta property="og:image:width" content="600"><meta property="og:image:height" content="600"><meta property="og:image:alt" content="The symbol of the new site"><meta name="twitter:card" content="summary">
<noscript><meta http-equiv="refresh" content="0; url=https://jehlp.net/omniscient-readers-viewpoint/"></noscript>
<script>
// This reader moved. Keep old chapter and paragraph links working.
let target = 'https://jehlp.net/omniscient-readers-viewpoint/';
try {
  const [chapter, paragraph] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (/^[a-z0-9-]+$/.test(chapter)) {
    target += `?chapter=${chapter}`;
    const number = /^p-(\d+)$/.exec(paragraph || '');
    if (number) target += `#line-${chapter}-${Number(number[1])}`;
  }
} catch {
  // A malformed address goes to the start of the reader.
}
location.replace(target);
</script>
</head>
<body>
<p><a href="https://jehlp.net/omniscient-readers-viewpoint/">Omniscient Reader’s Viewpoint has moved.</a></p>
</body>
